<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { f04: { x: 0, y: 0 } };

  componentDidMount() {
    this._kd = (e) => {
      if (!e.key || e.key.indexOf('Arrow') !== 0) return;
      const f = this.state.f04;
      const j = () => Math.random() * 26 - 13;
      let x = f.x, y = f.y;
      if (e.key === 'ArrowLeft') x += 60;
      if (e.key === 'ArrowRight') x -= 60;
      if (e.key === 'ArrowUp') y += 38;
      if (e.key === 'ArrowDown') y -= 38;
      x = Math.max(-180, Math.min(180, x + j()));
      y = Math.max(-70, Math.min(70, y + j()));
      this.setState({ f04: { x, y } });
    };
    window.addEventListener('keydown', this._kd);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._kd); }

  renderVals() {
    return {
      f04Style: {
        position: 'relative',
        transform: 'translate(' + this.state.f04.x + 'px,' + this.state.f04.y + 'px)',
        transition: 'transform .18s ease-out'
      }
    };
  }
}
</script>
<script>
// Page-wide background: dot grid + warm spotlight that lights up the dots around the pointer,
// plus a fading pointer trail. Plain DOM/canvas outside the dc/React tree so moves never re-render.
(() => {
  const WARM = '240,220,180';
  const layer = (css) => {
    const el = document.createElement('div');
    el.setAttribute('aria-hidden', 'true');
    el.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;' + css;
    document.body.appendChild(el);
    return el;
  };
  const DOTS = 'background-size:26px 26px;background-position:13px 13px;';
  layer(DOTS + 'background-image:radial-gradient(rgba(240,232,216,.07) 1px,transparent 1.3px)');

  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine) return;

  // pages without their own cursor (.cur-none) get the same blended dot as the home page
  if (!document.querySelector('.cur-none')) {
    const st = document.createElement('style');
    st.textContent = 'html.xl-cur,html.xl-cur *{cursor:none!important}';
    document.head.appendChild(st);
    document.documentElement.classList.add('xl-cur');
    const dot = document.createElement('div');
    dot.setAttribute('aria-hidden', 'true');
    dot.style.cssText = 'position:fixed;left:0;top:0;z-index:300;pointer-events:none;width:9px;height:9px;border-radius:99px;background:#f0dcb4;border:1.5px solid transparent;mix-blend-mode:difference;opacity:0;transform:translate(-50%,-50%);transition:width .18s,height .18s,background .18s,border-color .18s,opacity .25s';
    document.body.appendChild(dot);
    addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const big = !!(e.target.closest && e.target.closest('a,button,input,textarea,[role=button]'));
      dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; dot.style.opacity = '1';
      dot.style.width = dot.style.height = big ? '32px' : '9px';
      dot.style.background = big ? 'transparent' : '#f0dcb4';
      dot.style.borderColor = big ? '#f0dcb4' : 'transparent';
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => { dot.style.opacity = '0'; });
  }

  const MASK = 'radial-gradient(circle 230px at var(--mx) var(--my),#000,rgba(0,0,0,.35) 55%,transparent 100%)';
  const fade = 'opacity:0;transition:opacity .4s;';
  const glow = layer(fade + 'background:radial-gradient(circle 460px at var(--mx) var(--my),rgba(' + WARM + ',.085),rgba(' + WARM + ',.03) 45%,transparent 75%)');
  const lit = layer(fade + DOTS + 'background-image:radial-gradient(rgba(' + WARM + ',.6) 1.1px,transparent 1.5px);-webkit-mask-image:' + MASK + ';mask-image:' + MASK);
  const setPos = (x, y) => {
    for (const el of [glow, lit]) { el.style.setProperty('--mx', x + 'px'); el.style.setProperty('--my', y + 'px'); }
  };
  const show = (on) => { glow.style.opacity = lit.style.opacity = on ? '1' : '0'; };

  let cv = null, ctx = null, w = 0, h = 0;
  if (!still) {
    cv = document.createElement('canvas');
    cv.setAttribute('aria-hidden', 'true');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';
    document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    const resize = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    addEventListener('resize', resize);
  }

  const TRAIL_MS = 520, SPARK_MS = 900;
  const trail = [], sparks = [];
  let raf = 0, last = null;

  addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const x = e.clientX, y = e.clientY;
    setPos(x, y);
    show(true);
    if (!ctx) return;
    const now = performance.now();
    trail.push({ x, y, t: now });
    if (last) {
      const d = Math.hypot(x - last.x, y - last.y);
      if (Math.random() < Math.min(d / 45, 0.7)) {
        const a = Math.random() * Math.PI * 2, v = 0.2 + Math.random() * 0.6;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.25, r: 0.8 + Math.random() * 1.6, t: now, hot: Math.random() < 0.18 });
      }
    }
    last = { x, y };
    if (!raf) raf = requestAnimationFrame(draw);
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { last = null; show(false); });

  function draw(now) {
    ctx.clearRect(0, 0, w, h);
    while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // two passes: wide faint glow, then thin bright core
    for (const [wMul, aMul] of [[4.5, 0.08], [1, 0.45]]) {
      for (let i = 1; i < trail.length; i++) {
        const a = trail[i - 1], b = trail[i];
        const k = 1 - (now - b.t) / TRAIL_MS;
        ctx.strokeStyle = 'rgba(' + WARM + ',' + (k * k * aMul).toFixed(3) + ')';
        ctx.lineWidth = (0.6 + k * 2.6) * wMul;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i], k = 1 - (now - s.t) / SPARK_MS;
      if (k <= 0) { sparks.splice(i, 1); continue; }
      s.x += s.vx; s.y += s.vy; s.vx *= 0.97; s.vy = s.vy * 0.97 - 0.004;
      ctx.fillStyle = s.hot ? 'rgba(255,82,48,' + (k * 0.7).toFixed(3) + ')' : 'rgba(' + WARM + ',' + (k * 0.6).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + k * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    raf = (trail.length || sparks.length) ? requestAnimationFrame(draw) : 0;
    if (!raf) ctx.clearRect(0, 0, w, h);
  }
})();
</script>
