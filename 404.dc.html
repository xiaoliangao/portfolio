<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
  <title>404 · xiaoliang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: rgba(249, 250, 251, 0.78);
      --surface-hover: rgba(255, 255, 255, 0.96);
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --ink: #111827;
      --ink2: #4b5563;
      --mute: #6b7280;
      --charcoal: #18181b;
      --blue: #2563eb;
      --seal: #d9381a;
      --dock-bg: rgba(255, 255, 255, 0.88);
      --font-heading: 'Newsreader', 'Noto Serif SC', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    ::selection { background: #18181b; color: #ffffff; }

    /* Restrained WebGL Subtle Ring-Particle Canvas */
    #subtleRingCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      display: block;
    }

    /* Personal "Liang" Seal Overlay — only on the home view; hidden on Git etc. */
    body:not([data-view="home"]) #stampOverlay { display: none; }
    #stampOverlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-seal {
      position: absolute;
      transform: translate(-50%, -50%);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 11px 4px;
      border: 1.5px solid var(--seal);
      border-radius: 5px;
      color: var(--seal);
      font-family: var(--font-heading);
      font-style: italic;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.03em;
      line-height: 1;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 14px rgba(217, 56, 26, 0.08);
      animation: sealIn 0.36s var(--ease) forwards;
      user-select: none;
    }

    .floating-seal::after {
      content: '2026';
      margin-top: 2px;
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 7px;
      letter-spacing: 0.16em;
      opacity: 0.7;
    }

    @keyframes sealIn {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(1.35) rotate(var(--rot, -4deg)); }
      100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1) rotate(var(--rot, -4deg)); }
    }

    /* Main Shell */
    .shell {
      position: relative;
      z-index: 2;
      max-width: 1020px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top, 0px)) 28px 128px;
      pointer-events: none;
    }

    .shell a,
    .shell button,
    .shell input,
    .shell textarea,
    .shell .split-left,
    .shell .split-right,
    .shell .paper-stage,
    .shell .gb-layout,
    .shell .site-footer {
      pointer-events: auto;
    }

    /* Clean Understated Masthead */
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border);
      pointer-events: auto;
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink);
    }

    /* Bespoke Original XL Geometric Seal Logo (Zero agy borrowing) */
    .xl-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      transition: transform 0.3s var(--ease);
    }
    .brand-group:hover .xl-logo { transform: rotate(-4deg) scale(1.04); }

    .brand-text {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 16.5px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .masthead-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink2);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .chip-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .clear-seals-btn {
      display: none;
      border-color: rgba(217, 56, 26, 0.35);
      color: var(--seal);
    }
    .clear-seals-btn.visible { display: inline-flex; }

    /* Views */
    .view { display: none; animation: viewIn 0.35s var(--ease); }
    .view.active { display: block; }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Calm Sticky Split Layout */
    .split-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 64px;
      align-items: start;
      padding-top: 44px;
    }

    .split-left {
      position: sticky;
      top: 32px;
      align-self: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      min-height: calc(100vh - 156px);
    }

    /* Avatar: EANG — the Muse plush, typing on a laptop (transparent cutout, mint disc) */
    .avatar-char {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.14);
      animation: char-bob 3.6s ease-in-out infinite;
    }
    .avatar-char::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #fff;
    }
    .avatar-char img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      animation: typing 1.8s ease-in-out infinite;
    }
    .avatar-char:hover { animation-play-state: paused; }
    @keyframes char-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes typing {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(-2deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-12px) rotate(2deg); }
    }
    .avatar-char .type-char {
      position: absolute;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      animation: type-float 4s ease-out infinite;
    }
    .avatar-char .type-char.t1 { left: 90px; bottom: 34px; animation-delay: 0s; }
    .avatar-char .type-char.t2 { left: 96px; bottom: 34px; animation-delay: 1.33s; }
    .avatar-char .type-char.t3 { left: 92px; bottom: 34px; animation-delay: 2.66s; }
    @keyframes type-float {
      0% { transform: translateY(0) scale(0.4); opacity: 0; }
      8% { transform: translateY(-8px) scale(1.25); opacity: 1; }
      20% { transform: translateY(-20px) scale(1); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }
    .avatar-char.excited { animation: char-pop 0.8s ease; }
    @keyframes char-pop {
      0% { transform: scale(1) translateY(0); }
      30% { transform: scale(0.94, 1.06) translateY(2px); }
      60% { transform: scale(1.2, 0.9) translateY(-12px); }
      100% { transform: scale(1) translateY(0); }
    }
    .avatar-char .burst-note {
      position: absolute;
      z-index: 2;
      font-size: 22px;
      color: #d4a017;
      pointer-events: none;
      animation: burst-up 2.2s ease-out forwards;
      font-family: Georgia, 'Times New Roman', serif;
      text-shadow: 0 1px 6px rgba(212, 160, 23, 0.45);
    }
    @keyframes burst-up {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-60px) scale(1.2) rotate(20deg); opacity: 0; }
    }
    @media (max-width: 860px) {
      .avatar-char { width: 140px; height: 140px; }
      .avatar-char .type-char { font-size: 20px; }
      .avatar-char .type-char.t1 { left: 70px; bottom: 26px; }
      .avatar-char .type-char.t2 { left: 75px; bottom: 26px; }
      .avatar-char .type-char.t3 { left: 72px; bottom: 26px; }
    }

    .left-name {
      font-family: var(--font-sans);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink);
      letter-spacing: -0.025em;
      margin-top: 18px;
    }

    .left-sub {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--mute);
      margin-top: 4px;
    }

    .left-role {
      font-size: 14px;
      color: var(--ink2);
      margin-top: 12px;
      line-height: 1.68;
    }

    .now-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(8px);
      font-size: 12px;
      color: var(--ink2);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .now-pill:hover { border-color: var(--border-strong); color: var(--ink); }

    .pulse-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    /* Sticky Scroll-Spy Nav */
    .sticky-nav { display: flex; flex-direction: column; gap: 9px; }

    .snav-btn {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      background: none;
      border: none;
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      width: fit-content;
      padding: 3px 0;
      transition: color 0.22s ease;
    }

    .snav-line {
      width: 20px;
      height: 1.5px;
      background: #d1d5db;
      transition: width 0.28s var(--ease), background 0.22s ease;
    }

    .snav-btn:hover,
    .snav-btn.active { color: var(--ink); font-weight: 500; }
    .snav-btn:hover .snav-line,
    .snav-btn.active .snav-line { width: 44px; background: var(--ink); }

    .primary-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      background: var(--charcoal);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(24, 24, 27, 0.12);
      transition: transform 0.2s var(--ease), background 0.2s ease;
    }
    .primary-pill:hover { background: #27272a; transform: translateY(-1px); }
    .contact-group {
      display: inline-flex;
      align-items: stretch;
      width: fit-content;
      border-radius: 999px;
      background: var(--charcoal);
      box-shadow: 0 4px 12px rgba(24, 24, 27, 0.12);
      overflow: hidden;
    }
    .contact-seg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s ease;
    }
    .contact-seg:hover { background: #27272a; }
    .contact-div { width: 1px; background: rgba(255, 255, 255, 0.28); margin: 9px 0; }


    .clean-link {
      color: var(--ink2);
      text-decoration: none;
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .clean-link:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

    .pipe-sep { width: 1px; height: 11px; background: var(--border-strong); }

    /* Right Content Column (Restrained Scale & Clean Hierarchy) */
    .right-sec {
      margin-bottom: 64px;
      scroll-margin-top: 32px;
    }

    .editorial-h1 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: clamp(28px, 3.4vw, 36px);
      line-height: 1.32;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .editorial-h1 em {
      font-style: italic;
      color: var(--blue);
    }

    .body-p {
      font-size: 15px;
      line-height: 1.82;
      color: var(--ink2);
      margin-bottom: 14px;
    }
    .body-p strong { color: var(--ink); font-weight: 600; }

    .sec-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-bottom: 20px;
    }

    .sec-label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 500;
    }

    .sec-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--mute);
    }

    /* Subtle Focus Cards */
    .dim-list { display: flex; flex-direction: column; gap: 12px; }
    .dim-list:hover .dim-item { opacity: 0.62; }
    .dim-list:hover .dim-item:hover { opacity: 1; }

    .dim-item {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 16px;
      padding: 20px 22px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.22s var(--ease), opacity 0.24s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .dim-item:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-1.5px);
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.045);
    }

    .item-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); padding-top: 3px; }
    .item-title {
      font-family: var(--font-heading);
      font-size: 17.5px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-desc { font-size: 14px; line-height: 1.72; color: var(--ink2); margin-bottom: 12px; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--ink2);
    }

    .filter-row { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .flt-btn {
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink2);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .flt-btn.active {
      background: var(--charcoal);
      border-color: var(--charcoal);
      color: #ffffff;
    }
    .flt-btn:not(.active):hover { border-color: var(--ink); color: var(--ink); }

    .stack-toggle {
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 10.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .stack-toggle:hover { border-color: var(--ink); color: var(--ink); }

    /* Writing List */
    .writing-index { border-top: 1px solid var(--border); }
    .w-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 12px;
      align-items: baseline;
      padding: 16px 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s ease, padding-left 0.22s var(--ease);
    }
    .w-row:hover { background: var(--surface); padding-left: 14px; }
    .w-num { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); }
    .w-title { font-family: var(--font-heading); font-size: 18px; font-weight: 500; color: var(--ink); line-height: 1.35; }
    .w-meta { font-family: var(--font-mono); font-size: 11px; color: var(--mute); white-space: nowrap; }

    /* Guestbook View */
    .gb-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      padding-top: 38px;
      align-items: start;
    }

    .gb-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(12px);
    }

    .f-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--mute);
      margin-bottom: 6px;
    }

    .f-input, .f-area {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      color: var(--ink);
      font-family: inherit;
      font-size: 13.5px;
      margin-bottom: 13px;
      outline: none;
    }
    .f-input:focus, .f-area:focus { border-color: var(--ink); }

    .f-submit {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: var(--charcoal);
      color: #ffffff;
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;
    }

    .stamp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .stamp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      backdrop-filter: blur(10px);
    }
    .stamp-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--seal);
      color: var(--seal);
      background: #ffffff;
      margin-bottom: 8px;
    }

    /* Paper Resume View */
    .paper-stage { display: flex; flex-direction: column; align-items: center; padding: 34px 0 16px; }
    .paper-stack { position: relative; width: 100%; max-width: 720px; }
    .paper-under {
      position: absolute;
      inset: 8px -5px -8px 7px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      transform: rotate(0.8deg);
      z-index: 0;
    }
    .paper-sheet {
      position: relative;
      z-index: 1;
      background: #ffffff;
      color: #18181b;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 44px 48px 56px;
      min-height: 700px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.07);
      transition: opacity 0.22s ease;
      overflow: hidden;
    }
    .paper-sheet.flipping { opacity: 0.4; }

    .paper-seal {
      position: absolute;
      right: 46px;
      bottom: 60px;
      padding: 6px 13px 5px;
      border: 1.6px solid var(--seal);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--seal);
      font-family: var(--font-heading);
      font-style: italic;
      font-weight: 500;
      font-size: 20px;
      line-height: 1;
      transform: rotate(-5deg);
      opacity: 0.85;
      pointer-events: none;
    }
    .paper-seal span {
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 7px;
      letter-spacing: 0.15em;
      margin-top: 3px;
    }

    .p-head {
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }
    .p-name { font-family: var(--font-heading); font-size: 32px; font-weight: 600; color: #09090b; line-height: 1.1; }
    .p-role { font-size: 13.5px; color: #52525b; margin-top: 4px; }
    .p-contact { font-family: var(--font-mono); font-size: 11.5px; color: #52525b; text-align: right; line-height: 1.68; }
    .p-sec { margin-bottom: 18px; }
    .p-sec-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    .p-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .p-row-t { font-weight: 600; font-size: 14px; color: #18181b; }
    .p-row-d { font-family: var(--font-mono); font-size: 11px; color: #71717a; white-space: nowrap; }
    .p-desc { font-size: 13.5px; line-height: 1.68; color: #3f3f46; margin-bottom: 12px; }
    .p-num { position: absolute; left: 48px; bottom: 20px; font-family: var(--font-mono); font-size: 11px; color: #a1a1aa; }
    .page-curl {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, transparent 48%, rgba(15, 23, 42, 0.08) 50%, #e5e7eb 53%, #ffffff 78%, #d1d5db 100%);
      border: none;
      cursor: pointer;
      transition: width 0.22s var(--ease), height 0.22s var(--ease);
    }
    .page-curl:hover { width: 66px; height: 66px; }

    .paper-ctrls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    .p-ctrl {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .p-ctrl:hover { border-color: var(--ink); }
    .p-ctrl.primary { background: var(--charcoal); color: #ffffff; border-color: var(--charcoal); }

    /* Footer */
    .site-footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12.5px;
      color: var(--mute);
    }
    .footer-motto {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: 14px;
      color: var(--ink2);
    }
    @media (max-width: 860px) {
      .site-footer { flex-direction: column; align-items: stretch; }
    }

    /* Git activity view (dock tab) — light editorial style, full-year heatmap */
    .git-page { padding: 8px 0 120px; }
    .git-h {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 10px 0 8px;
    }
    .git-updated { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--mute); margin-bottom: 4px; }
    .git-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .git-stat {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px 12px;
      background: #fcfcfa;
    }
    .git-stat-n { font-family: var(--font-heading); font-size: 26px; font-weight: 600; }
    .git-stat-l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; color: var(--mute); margin-top: 2px; }
    .git-cal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scrollbar-width: thin; padding-bottom: 4px; pointer-events: auto; }
    .git-cal { display: inline-flex; gap: 10px; width: max-content; }
    .git-cal-days { position: relative; width: 24px; flex: none; font-family: var(--font-mono); font-size: 9.5px; color: var(--mute); }
    .git-cal-days span { position: absolute; left: 0; }
    .git-cal-days span:nth-child(1) { top: 37px; }
    .git-cal-days span:nth-child(2) { top: 71px; }
    .git-cal-days span:nth-child(3) { top: 105px; }
    .git-cal-main { display: flex; flex-direction: column; gap: 4px; }
    .git-cal-months { position: relative; height: 14px; font-family: var(--font-mono); font-size: 10px; color: var(--mute); }
    .git-cal-months span { position: absolute; top: 0; }
    .git-cal-grid { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; }
    .git-cell { width: 14px; height: 14px; border-radius: 3px; background: #eef2f7; border: none; padding: 0; cursor: pointer; }
    .git-cell.c1 { background: #a7f3d0; }
    .git-cell.c2 { background: #6ee7b7; }
    .git-cell.c3 { background: #34d399; }
    .git-cell.c4 { background: #059669; }
    .git-cell.sel { outline: 2px solid #d4a017; outline-offset: 1px; }
    .git-legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font-family: var(--font-mono); font-size: 10.5px; color: var(--mute); margin-top: 10px; }
    .git-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid var(--border); }
    .git-day { margin: 12px 0 4px; font-size: 13px; color: var(--ink2); }
    .git-clear { margin-left: 8px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; color: var(--ink2); }
    .git-day-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--mute); margin: 18px 0 6px; }
    .git-item { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 13.5px; align-items: baseline; }
    .git-item-time { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); flex: none; width: 44px; }
    .git-item-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .git-item-msg a { color: inherit; text-decoration: none; }
    .git-item-msg a:hover { text-decoration: underline; }
    .git-repo { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; flex: none; }
    .git-more { margin-top: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; }
    .git-more:hover { border-color: var(--ink); }
    .git-note { margin-top: 18px; font-size: 12px; color: var(--mute); }
    .git-empty { padding: 26px 0; color: var(--mute); font-size: 13.5px; }
    @media (max-width: 860px) {
      .git-stats { grid-template-columns: repeat(2, 1fr); }
      .git-h { font-size: 25px; }
      .git-item { gap: 8px; align-items: flex-start; }
      .git-item-time { width: 36px; font-size: 11px; padding-top: 1px; }
      .git-item-msg { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .git-repo { font-size: 10px; padding: 1px 6px; margin-top: 1px; }
    }

    /* Bottom Floating Capsule Dock */
    .dock-wrap {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
    }

    .dock {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      background: var(--dock-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .dock-btn {
      padding: 7px 15px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--ink2);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.22s var(--ease);
    }
    .dock-btn:hover { color: var(--ink); }
    .dock-btn.active { background: var(--charcoal); color: #ffffff; }

    .sound-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      flex-shrink: 0;
      color: var(--ink2);
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .sound-btn:hover { border-color: var(--ink); color: var(--ink); }
    .sound-bars { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
    .s-bar { width: 2px; height: 6px; border-radius: 2px; background: #9ca3af; }
    .sound-btn.playing { border-color: var(--ink); color: var(--ink); }
    .sound-btn.playing .s-bar { background: var(--ink); animation: sWave 1.1s ease-in-out infinite; }
    .sound-btn.playing .s-bar:nth-child(2) { animation-delay: 0.2s; }
    .sound-btn.playing .s-bar:nth-child(3) { animation-delay: 0.4s; }
    .sound-btn.playing .s-bar:nth-child(4) { animation-delay: 0.15s; }
    @keyframes sWave { 0%, 100% { height: 4px; } 50% { height: 13px; } }

    /* Command Palette (⌘K) */
    .cmd-bg {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(17, 24, 39, 0.24);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 14vh 20px 20px;
    }
    .cmd-bg.open { display: flex; animation: viewIn 0.18s var(--ease); }
    .cmd-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 56px rgba(15, 23, 42, 0.16);
    }
    .cmd-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--mute);
    }
    .cmd-list { padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    .cmd-item {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
    }
    .cmd-item:hover { background: #f3f4f6; }
    .cmd-key { font-family: var(--font-mono); font-size: 11px; color: var(--mute); }

    /* Reader Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(17, 24, 39, 0.28);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 620px;
      max-height: 82vh;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      position: relative;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.16);
    }
    .modal-x {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--ink);
      font-size: 17px;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      z-index: 90;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--charcoal);
      color: #ffffff;
      font-size: 12.5px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s var(--ease);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 860px) {
      .split-layout { grid-template-columns: 1fr; gap: 32px; padding-top: 28px; }
      .split-left { position: static; min-height: auto; }
      .sticky-nav { display: none; }
      .dim-item { grid-template-columns: 1fr; gap: 6px; }
      .gb-layout { grid-template-columns: 1fr; }
      .paper-sheet { padding: 28px 20px 48px; min-height: 560px; }
      .paper-under { display: none; }
      .paper-seal { right: 20px; bottom: 48px; font-size: 17px; }
      .sound-label { display: none; }
    }

    @media print {
      #subtleRingCanvas, #stampOverlay, .masthead, .dock-wrap, .site-footer,
      .paper-ctrls, .paper-under, .page-curl, .modal-bg, .cmd-bg, .toast {
        display: none !important;
      }
      html, body { background: #ffffff !important; color: #111111 !important; }
      .shell { max-width: 100% !important; padding: 0 !important; }
      .view { display: none !important; }
      #view-resume { display: block !important; }
      .paper-stage { padding: 0 !important; }
      .paper-sheet { box-shadow: none !important; border: none !important; padding: 10px 14px !important; min-height: auto !important; }
    }
    /* Guestbook server state */
    .hp-field { position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden; }
    .gb-meta { display:flex; justify-content:space-between; gap:12px; margin-top:10px; font-family:var(--font-mono); font-size:11px; color:var(--mute); }
    .gb-more-wrap { margin-top:16px; text-align:center; }
    .gb-status { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; color:var(--mute); }
    .writing-index a.w-row { text-decoration:none; }
</style>
