<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<style>
body{margin:0;background:#0d0b08;font-family:'Noto Sans SC',system-ui,sans-serif;color:#f0e8d8}
a{color:inherit;text-decoration:none}
a:hover{opacity:.95}
.gb-form input:focus{border-color:rgba(255,82,48,.6)!important}
::selection{background:#ff5230;color:#0d0b08}
@keyframes stampIn{0%{opacity:0;transform:scale(1.9) rotate(-7deg)}55%{opacity:1;transform:scale(.94) rotate(1.5deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,158,107,.55)}50%{box-shadow:0 0 0 7px rgba(74,158,107,0)}}
@media(max-width:820px){
.gb-grid{grid-template-columns:1fr 1fr!important}
}
@media(max-width:560px){
.gb-grid{grid-template-columns:1fr!important;gap:14px!important}
.gb-form{flex-wrap:wrap!important}
.gb-name{width:100%!important;box-sizing:border-box}
[style*="padding:18px 32px;border-bottom"]{padding:14px 18px!important}
[style*="padding:44px 32px 0"]{padding:30px 18px 0!important}
[style*="font-size:34px"]{font-size:26px!important}
[style*="padding:26px 28px"]{padding:20px 18px!important}
}
</style>
</helmet>

<div data-screen-label="留言墙" style="min-height:100vh">
  <div style="max-width:1060px;margin:0 auto;padding-bottom:60px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid rgba(240,232,216,.1)">
      <a href="首页.dc.html" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#9a8f7c;transition:color .15s" style-hover="color:#ff5230">← 回首页</a>
      <span style="font-family:'LXGW WenKai','LXGW WenKai TC',serif;font-size:18px;font-weight:700">xiaoliang<span style="color:#ff5230">.</span></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#9a8f7c">GUESTBOOK</span>
    </div>

    <div style="padding:44px 32px 0">
      <h1 style="margin:0;font-family:'LXGW WenKai','LXGW WenKai TC',serif;font-size:34px;font-weight:700">路过，<span style="color:#ff5230">留个爪印</span>。</h1>
      <p style="margin:10px 0 0;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.14em;color:#9a8f7c">匿名也行 · 会一直留着 · 共 {{ gbCount }} 条</p>

      <div class="gb-form" style="margin-top:26px;display:flex;gap:12px">
        <input class="gb-name" value="{{ gbName }}" onChange="{{ gbNameChange }}" onKeyDown="{{ gbKey }}" maxLength="24" autoComplete="nickname" aria-label="名字" placeholder="名字（可空）" style="width:150px;background:#14100b;border:1px solid rgba(240,232,216,.2);border-radius:12px;padding:12px 16px;color:#f0e8d8;font-size:13.5px;font-family:'Noto Sans SC',sans-serif;outline:none">
        <textarea value="{{ gbText }}" onChange="{{ gbTextChange }}" onKeyDown="{{ gbKey }}" maxLength="300" rows="1" aria-label="留言" placeholder="想说的话 …（回车发送，Shift+回车换行）" style="flex:1;min-width:0;resize:vertical;min-height:44px;max-height:180px;line-height:1.6;box-sizing:border-box;background:#14100b;border:1px solid rgba(240,232,216,.2);border-radius:12px;padding:12px 16px;color:#f0e8d8;font-size:13.5px;font-family:'Noto Sans SC',sans-serif;outline:none"></textarea>
        <a href="留言墙.dc.html" role="button" aria-disabled="{{ gbPosting }}" onClick="{{ gbSubmit }}" style="flex:none;display:inline-flex;align-items:center;justify-content:center;background:#ff5230;color:#0d0b08;font-size:13.5px;font-weight:700;border-radius:12px;padding:12px 22px;cursor:{{ gbBtnCursor }};opacity:{{ gbBtnOpacity }};transition:all .15s" style-hover="background:#f0e8d8">贴上去 →</a>
      </div>
      <div aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden">
        <input name="website" tabIndex="-1" autoComplete="off" value="{{ gbHp }}" onChange="{{ gbHpChange }}" placeholder="website">
      </div>
      <div style="margin-top:10px;min-height:16px;display:flex;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em">
        <span role="status" aria-live="polite" style="color:{{ gbMsgColor }}">{{ gbMsg }}</span>
        <span style="flex:none;color:{{ gbLenColor }}">{{ gbLen }}/300</span>
      </div>

      <div class="gb-grid" style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start">
        <sc-for list="{{ gbItems }}" as="m">
          <div style="position:relative;border-radius:14px;transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s;cursor:default" style-hover="transform:scale(1.14) translateY(-4px);box-shadow:0 28px 64px rgba(0,0,0,.7);z-index:5">
            <div style="{{ m.style }}">
              <span style="font-family:'LXGW WenKai','LXGW WenKai TC',serif;font-size:17px;line-height:1.8;color:#f0e8d8;white-space:pre-wrap;overflow-wrap:anywhere">{{ m.t }}</span>
              <span style="display:flex;justify-content:space-between;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px"><span style="color:#ff5230;overflow-wrap:anywhere">— {{ m.n }}</span><span title="{{ m.full }}" style="flex:none;color:#6f675a">{{ m.d }}</span></span>
            </div>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ gbStatus }}">
        <div style="margin-top:8px;padding:28px 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:#6f675a">{{ gbStatus }}<sc-if value="{{ gbLoadError }}"> · <a href="留言墙.dc.html" onClick="{{ gbRetry }}" style="color:#ff5230;cursor:pointer">重试</a></sc-if></div>
      </sc-if>

      <sc-if value="{{ gbHasMore }}">
        <div style="margin-top:30px;text-align:center">
          <a href="留言墙.dc.html" role="button" onClick="{{ gbLoadMore }}" style="display:inline-flex;align-items:center;border:1px solid rgba(240,232,216,.2);border-radius:12px;padding:10px 22px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#9a8f7c;cursor:pointer;transition:all .15s" style-hover="color:#ff5230;border-color:#ff5230">{{ gbMoreLabel }}</a>
        </div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const GB_API = '/api/guestbook';
const GB_PAGE = 30;
const GB_NAME_MAX = 24;
const GB_TEXT_MAX = 300;
const GB_COLORS = ['#1c120d', '#121509', '#1a150c', '#171013'];
const GB_TILT = [-1.4, 1.1, -0.7, 1.6];

// Code points, not UTF-16 units, to match the server's length check.
const gbLen = (s) => Array.from(s).length;

async function gbFetch(url, opts) {
  let res;
  try {
    res = await fetch(url, { cache: 'no-store', ...opts, headers: { Accept: 'application/json', ...(opts && opts.headers) } });
  } catch (_) {
    return { ok: false, status: 0, data: { message: '网络好像断了，稍后再试' } };
  }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  return { ok: res.ok, status: res.status, data: data || {} };
}

function gbWhen(iso, now) {
  const d = new Date(iso);
  if (isNaN(d)) return { d: '', full: '' };
  const p = (n) => String(n).padStart(2, '0');
  const full = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  const s = Math.max(0, (now - d.getTime()) / 1000);
  let rel;
  if (s < 60) rel = '刚刚';
  else if (s < 3600) rel = Math.floor(s / 60) + ' 分钟前';
  else if (s < 86400) rel = Math.floor(s / 3600) + ' 小时前';
  else if (s < 7 * 86400) rel = Math.floor(s / 86400) + ' 天前';
  else if (d.getFullYear() === new Date(now).getFullYear()) rel = p(d.getMonth() + 1) + '-' + p(d.getDate());
  else rel = full.slice(0, 10);
  return { d: rel, full };
}

class Component extends DCLogic {
  state = {
    gbName: '',
    gbText: '',
    gbHp: '',
    gbList: [],
    gbTotal: null,
    gbHasMore: false,
    gbLoading: true,
    gbLoadError: false,
    gbLoadingMore: false,
    gbPosting: false,
    gbMsg: '',
    gbMsgErr: false,
    now: Date.now()
  };

  componentDidMount() {
    let name = '';
    try { name = localStorage.getItem('xl-gb-name') || ''; } catch (_) {}
    if (name) this.setState({ gbName: name.slice(0, GB_NAME_MAX) });
    this.gbLoad();
    // Keep relative times ("3 分钟前") fresh.
    this._tick = setInterval(() => this.setState({ now: Date.now() }), 60000);
  }
  componentWillUnmount() { clearInterval(this._tick); }

  gbLoad = async (more) => {
    if (more) {
      if (this.state.gbLoadingMore) return;
      this.setState({ gbLoadingMore: true });
    } else {
      this.setState({ gbLoading: true, gbLoadError: false });
    }
    const list = this.state.gbList;
    const before = more && list.length ? '&before=' + list[list.length - 1].id : '';
    const r = await gbFetch(GB_API + '?limit=' + GB_PAGE + before);
    if (!r.ok || !Array.isArray(r.data.items)) {
      if (more) this.setState({ gbLoadingMore: false, gbMsg: '加载失败，稍后再试', gbMsgErr: true });
      else this.setState({ gbLoading: false, gbLoadError: true });
      return;
    }
    const cur = more ? this.state.gbList : [];
    const seen = new Set(cur.map((m) => m.id));
    this.setState({
      gbList: cur.concat(r.data.items.filter((m) => !seen.has(m.id))),
      gbHasMore: !!r.data.has_more,
      gbTotal: typeof r.data.total === 'number' ? r.data.total : this.state.gbTotal,
      gbLoading: false,
      gbLoadingMore: false,
      now: Date.now()
    });
  };

  gbNameChange = (e) => { this.setState({ gbName: e.target.value }); };
  gbTextChange = (e) => { this.setState({ gbText: e.target.value, gbMsg: '' }); };
  gbHpChange = (e) => { this.setState({ gbHp: e.target.value }); };
  gbKey = (e) => {
    // Ignore the Enter that confirms an IME candidate (e.g. pinyin input).
    if (e.key !== 'Enter' || e.nativeEvent.isComposing || e.keyCode === 229) return;
    if (e.shiftKey && e.currentTarget.tagName === 'TEXTAREA') return; // Shift+Enter = newline
    this.gbSubmit(e);
  };
  gbRetry = (e) => { e.preventDefault(); this.gbLoad(false); };
  gbLoadMore = (e) => { e.preventDefault(); this.gbLoad(true); };

  gbSubmit = async (e) => {
    e.preventDefault();
    if (this.state.gbPosting) return;
    const name = this.state.gbName.trim();
    const text = this.state.gbText.trim();
    if (!text) return this.setState({ gbMsg: '留言内容不能为空', gbMsgErr: true });
    if (gbLen(name) > GB_NAME_MAX) return this.setState({ gbMsg: '名字最多 ' + GB_NAME_MAX + ' 个字', gbMsgErr: true });
    if (gbLen(text) > GB_TEXT_MAX) return this.setState({ gbMsg: '留言最多 ' + GB_TEXT_MAX + ' 个字', gbMsgErr: true });

    this.setState({ gbPosting: true, gbMsg: '' });
    const r = await gbFetch(GB_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, content: text, website: this.state.gbHp })
    });
    if (!r.ok || !r.data.item) {
      const msg = r.data.message || (r.status === 429 ? '发得太快了，稍后再试' : '没贴上去，稍后再试');
      this.setState({ gbPosting: false, gbMsg: msg, gbMsgErr: true });
      return;
    }
    try { localStorage.setItem('xl-gb-name', name); } catch (_) {}
    const item = { ...r.data.item, fresh: true };
    this.setState({
      gbList: [item, ...this.state.gbList.filter((m) => m.id !== item.id)],
      gbTotal: (this.state.gbTotal || 0) + 1,
      gbText: '',
      gbPosting: false,
      gbMsg: '贴好了',
      gbMsgErr: false,
      now: Date.now()
    });
  };

  renderVals() {
    const s = this.state;
    const len = gbLen(s.gbText);
    let status = '';
    if (s.gbLoading && !s.gbList.length) status = '加载中 …';
    else if (s.gbLoadError) status = '留言加载失败';
    else if (!s.gbList.length) status = '还没有人留言，第一条留给你';
    return {
      gbName: s.gbName,
      gbText: s.gbText,
      gbHp: s.gbHp,
      gbNameChange: this.gbNameChange,
      gbTextChange: this.gbTextChange,
      gbHpChange: this.gbHpChange,
      gbKey: this.gbKey,
      gbSubmit: this.gbSubmit,
      gbRetry: this.gbRetry,
      gbLoadMore: this.gbLoadMore,
      gbPosting: s.gbPosting,
      gbBtnOpacity: s.gbPosting ? '.55' : '1',
      gbBtnCursor: s.gbPosting ? 'wait' : 'pointer',
      gbMsg: s.gbMsg,
      gbMsgColor: s.gbMsgErr ? '#ff5230' : '#4a9e6b',
      gbLen: len,
      gbLenColor: len > GB_TEXT_MAX - 20 ? '#ff5230' : '#6f675a',
      gbCount: s.gbTotal == null ? '…' : s.gbTotal,
      gbStatus: status,
      gbLoadError: s.gbLoadError,
      gbHasMore: s.gbHasMore && !s.gbLoadError,
      gbMoreLabel: s.gbLoadingMore ? '加载中 …' : '更多留言 ↓',
      gbItems: s.gbList.map((m) => {
        const w = gbWhen(m.created_at, s.now);
        return {
          t: m.content,
          n: m.name,
          d: w.d,
          full: w.full,
          style: {
            position: 'relative', background: GB_COLORS[m.id % 4],
            border: '1px solid rgba(240,232,216,.14)', borderRadius: '14px',
            padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: '12px',
            transform: 'rotate(' + GB_TILT[m.id % 4] + 'deg)',
            animation: m.fresh ? 'stampIn .5s cubic-bezier(.2,.8,.3,1.15) backwards' : 'none'
          }
        };
      })
    };
  }
}
</script>
<script>
// Page-wide background: dot grid + warm spotlight that lights up the dots around the pointer,
// plus a fading pointer trail. Plain DOM/canvas outside the dc/React tree so moves never re-render.
(() => {
  const WARM = '240,220,180';
  const layer = (css) => {
    const el = document.createElement('div');
    el.setAttribute('aria-hidden', 'true');
    el.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;' + css;
    document.body.appendChild(el);
    return el;
  };
  const DOTS = 'background-size:26px 26px;background-position:13px 13px;';
  layer(DOTS + 'background-image:radial-gradient(rgba(240,232,216,.07) 1px,transparent 1.3px)');

  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine) return;

  // pages without their own cursor (.cur-none) get the same blended dot as the home page
  if (!document.querySelector('.cur-none')) {
    const st = document.createElement('style');
    st.textContent = 'html.xl-cur,html.xl-cur *{cursor:none!important}';
    document.head.appendChild(st);
    document.documentElement.classList.add('xl-cur');
    const dot = document.createElement('div');
    dot.setAttribute('aria-hidden', 'true');
    dot.style.cssText = 'position:fixed;left:0;top:0;z-index:300;pointer-events:none;width:9px;height:9px;border-radius:99px;background:#f0dcb4;border:1.5px solid transparent;mix-blend-mode:difference;opacity:0;transform:translate(-50%,-50%);transition:width .18s,height .18s,background .18s,border-color .18s,opacity .25s';
    document.body.appendChild(dot);
    addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const big = !!(e.target.closest && e.target.closest('a,button,input,textarea,[role=button]'));
      dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; dot.style.opacity = '1';
      dot.style.width = dot.style.height = big ? '32px' : '9px';
      dot.style.background = big ? 'transparent' : '#f0dcb4';
      dot.style.borderColor = big ? '#f0dcb4' : 'transparent';
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => { dot.style.opacity = '0'; });
  }

  const MASK = 'radial-gradient(circle 230px at var(--mx) var(--my),#000,rgba(0,0,0,.35) 55%,transparent 100%)';
  const fade = 'opacity:0;transition:opacity .4s;';
  const glow = layer(fade + 'background:radial-gradient(circle 460px at var(--mx) var(--my),rgba(' + WARM + ',.085),rgba(' + WARM + ',.03) 45%,transparent 75%)');
  const lit = layer(fade + DOTS + 'background-image:radial-gradient(rgba(' + WARM + ',.6) 1.1px,transparent 1.5px);-webkit-mask-image:' + MASK + ';mask-image:' + MASK);
  const setPos = (x, y) => {
    for (const el of [glow, lit]) { el.style.setProperty('--mx', x + 'px'); el.style.setProperty('--my', y + 'px'); }
  };
  const show = (on) => { glow.style.opacity = lit.style.opacity = on ? '1' : '0'; };

  let cv = null, ctx = null, w = 0, h = 0;
  if (!still) {
    cv = document.createElement('canvas');
    cv.setAttribute('aria-hidden', 'true');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';
    document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    const resize = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    addEventListener('resize', resize);
  }

  const TRAIL_MS = 520, SPARK_MS = 900;
  const trail = [], sparks = [];
  let raf = 0, last = null;

  addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const x = e.clientX, y = e.clientY;
    setPos(x, y);
    show(true);
    if (!ctx) return;
    const now = performance.now();
    trail.push({ x, y, t: now });
    if (last) {
      const d = Math.hypot(x - last.x, y - last.y);
      if (Math.random() < Math.min(d / 45, 0.7)) {
        const a = Math.random() * Math.PI * 2, v = 0.2 + Math.random() * 0.6;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.25, r: 0.8 + Math.random() * 1.6, t: now, hot: Math.random() < 0.18 });
      }
    }
    last = { x, y };
    if (!raf) raf = requestAnimationFrame(draw);
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { last = null; show(false); });

  function draw(now) {
    ctx.clearRect(0, 0, w, h);
    while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // two passes: wide faint glow, then thin bright core
    for (const [wMul, aMul] of [[4.5, 0.08], [1, 0.45]]) {
      for (let i = 1; i < trail.length; i++) {
        const a = trail[i - 1], b = trail[i];
        const k = 1 - (now - b.t) / TRAIL_MS;
        ctx.strokeStyle = 'rgba(' + WARM + ',' + (k * k * aMul).toFixed(3) + ')';
        ctx.lineWidth = (0.6 + k * 2.6) * wMul;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i], k = 1 - (now - s.t) / SPARK_MS;
      if (k <= 0) { sparks.splice(i, 1); continue; }
      s.x += s.vx; s.y += s.vy; s.vx *= 0.97; s.vy = s.vy * 0.97 - 0.004;
      ctx.fillStyle = s.hot ? 'rgba(255,82,48,' + (k * 0.7).toFixed(3) + ')' : 'rgba(' + WARM + ',' + (k * 0.6).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + k * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    raf = (trail.length || sparks.length) ? requestAnimationFrame(draw) : 0;
    if (!raf) ctx.clearRect(0, 0, w, h);
  }
})();
</script>
</body>
</html>
