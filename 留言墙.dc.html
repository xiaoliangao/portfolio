<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>留言墙 · xiaoliang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: rgba(249, 250, 251, 0.78);
      --surface-hover: rgba(255, 255, 255, 0.96);
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --ink: #111827;
      --ink2: #4b5563;
      --mute: #6b7280;
      --charcoal: #18181b;
      --blue: #2563eb;
      --seal: #d9381a;
      --dock-bg: rgba(255, 255, 255, 0.88);
      --font-heading: 'Newsreader', 'Noto Serif SC', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    ::selection { background: #18181b; color: #ffffff; }

    /* Restrained WebGL Subtle Ring-Particle Canvas */
    #subtleRingCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      display: block;
    }

    /* Personal "Liang" Seal Overlay */
    #stampOverlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-seal {
      position: absolute;
      transform: translate(-50%, -50%);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 11px 4px;
      border: 1.5px solid var(--seal);
      border-radius: 5px;
      color: var(--seal);
      font-family: var(--font-heading);
      font-style: italic;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.03em;
      line-height: 1;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 14px rgba(217, 56, 26, 0.08);
      animation: sealIn 0.36s var(--ease) forwards;
      user-select: none;
    }

    .floating-seal::after {
      content: '2026';
      margin-top: 2px;
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 7px;
      letter-spacing: 0.16em;
      opacity: 0.7;
    }

    @keyframes sealIn {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(1.35) rotate(var(--rot, -4deg)); }
      100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1) rotate(var(--rot, -4deg)); }
    }

    /* Main Shell */
    .shell {
      position: relative;
      z-index: 2;
      max-width: 1020px;
      margin: 0 auto;
      padding: 0 28px 128px;
      pointer-events: none;
    }

    .shell a,
    .shell button,
    .shell input,
    .shell textarea,
    .shell .split-left,
    .shell .split-right,
    .shell .paper-stage,
    .shell .gb-layout,
    .shell .site-footer {
      pointer-events: auto;
    }

    /* Clean Understated Masthead */
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border);
      pointer-events: auto;
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink);
    }

    /* Bespoke Original XL Geometric Seal Logo (Zero agy borrowing) */
    .xl-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      transition: transform 0.3s var(--ease);
    }
    .brand-group:hover .xl-logo { transform: rotate(-4deg) scale(1.04); }

    .brand-text {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 16.5px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .masthead-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink2);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .chip-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .clear-seals-btn {
      display: none;
      border-color: rgba(217, 56, 26, 0.35);
      color: var(--seal);
    }
    .clear-seals-btn.visible { display: inline-flex; }

    /* Views */
    .view { display: none; animation: viewIn 0.35s var(--ease); }
    .view.active { display: block; }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Calm Sticky Split Layout */
    .split-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 64px;
      align-items: start;
      padding-top: 44px;
    }

    .split-left {
      position: sticky;
      top: 32px;
      align-self: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      min-height: calc(100vh - 156px);
    }

    /* Bespoke Architectural Identity Badge */
    .identity-emblem {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.10);
      cursor: pointer;
      transition: transform 0.28s var(--ease), box-shadow 0.28s ease;
    }
    .identity-emblem:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(17, 24, 39, 0.16);
    }

    .left-name {
      font-family: var(--font-sans);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink);
      letter-spacing: -0.025em;
      margin-top: 18px;
    }

    .left-sub {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--mute);
      margin-top: 4px;
    }

    .left-role {
      font-size: 14px;
      color: var(--ink2);
      margin-top: 12px;
      line-height: 1.68;
    }

    .now-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(8px);
      font-size: 12px;
      color: var(--ink2);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .now-pill:hover { border-color: var(--border-strong); color: var(--ink); }

    .pulse-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    /* Sticky Scroll-Spy Nav */
    .sticky-nav { display: flex; flex-direction: column; gap: 9px; }

    .snav-btn {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      background: none;
      border: none;
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      width: fit-content;
      padding: 3px 0;
      transition: color 0.22s ease;
    }

    .snav-line {
      width: 20px;
      height: 1.5px;
      background: #d1d5db;
      transition: width 0.28s var(--ease), background 0.22s ease;
    }

    .snav-btn:hover,
    .snav-btn.active { color: var(--ink); font-weight: 500; }
    .snav-btn:hover .snav-line,
    .snav-btn.active .snav-line { width: 44px; background: var(--ink); }

    .left-cta-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .primary-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      background: var(--charcoal);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(24, 24, 27, 0.12);
      transition: transform 0.2s var(--ease), background 0.2s ease;
    }
    .primary-pill:hover { background: #27272a; transform: translateY(-1px); }

    .inline-links {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .clean-link {
      color: var(--ink2);
      text-decoration: none;
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .clean-link:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

    .pipe-sep { width: 1px; height: 11px; background: var(--border-strong); }

    /* Right Content Column (Restrained Scale & Clean Hierarchy) */
    .right-sec {
      margin-bottom: 64px;
      scroll-margin-top: 32px;
    }

    .editorial-h1 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: clamp(28px, 3.4vw, 36px);
      line-height: 1.32;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .editorial-h1 em {
      font-style: italic;
      color: var(--blue);
    }

    .body-p {
      font-size: 15px;
      line-height: 1.82;
      color: var(--ink2);
      margin-bottom: 14px;
    }
    .body-p strong { color: var(--ink); font-weight: 600; }

    .sec-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-bottom: 20px;
    }

    .sec-label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 500;
    }

    .sec-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--mute);
    }

    /* Subtle Focus Cards */
    .dim-list { display: flex; flex-direction: column; gap: 12px; }
    .dim-list:hover .dim-item { opacity: 0.62; }
    .dim-list:hover .dim-item:hover { opacity: 1; }

    .dim-item {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 16px;
      padding: 20px 22px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.22s var(--ease), opacity 0.24s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .dim-item:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-1.5px);
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.045);
    }

    .item-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); padding-top: 3px; }
    .item-title {
      font-family: var(--font-heading);
      font-size: 17.5px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-desc { font-size: 14px; line-height: 1.72; color: var(--ink2); margin-bottom: 12px; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--ink2);
    }

    .filter-row { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .flt-btn {
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink2);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .flt-btn.active {
      background: var(--charcoal);
      border-color: var(--charcoal);
      color: #ffffff;
    }
    .flt-btn:not(.active):hover { border-color: var(--ink); color: var(--ink); }

    .stack-toggle {
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 10.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .stack-toggle:hover { border-color: var(--ink); color: var(--ink); }

    /* Writing List */
    .writing-index { border-top: 1px solid var(--border); }
    .w-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 12px;
      align-items: baseline;
      padding: 16px 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s ease, padding-left 0.22s var(--ease);
    }
    .w-row:hover { background: var(--surface); padding-left: 14px; }
    .w-num { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); }
    .w-title { font-family: var(--font-heading); font-size: 18px; font-weight: 500; color: var(--ink); line-height: 1.35; }
    .w-meta { font-family: var(--font-mono); font-size: 11px; color: var(--mute); white-space: nowrap; }

    /* Guestbook View */
    .gb-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      padding-top: 38px;
      align-items: start;
    }

    .gb-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(12px);
    }

    .f-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--mute);
      margin-bottom: 6px;
    }

    .f-input, .f-area {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      color: var(--ink);
      font-family: inherit;
      font-size: 13.5px;
      margin-bottom: 13px;
      outline: none;
    }
    .f-input:focus, .f-area:focus { border-color: var(--ink); }

    .f-submit {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: var(--charcoal);
      color: #ffffff;
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;
    }

    .stamp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .stamp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      backdrop-filter: blur(10px);
    }
    .stamp-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--seal);
      color: var(--seal);
      background: #ffffff;
      margin-bottom: 8px;
    }

    /* Paper Resume View */
    .paper-stage { display: flex; flex-direction: column; align-items: center; padding: 34px 0 16px; }
    .paper-stack { position: relative; width: 100%; max-width: 720px; }
    .paper-under {
      position: absolute;
      inset: 8px -5px -8px 7px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      transform: rotate(0.8deg);
      z-index: 0;
    }
    .paper-sheet {
      position: relative;
      z-index: 1;
      background: #ffffff;
      color: #18181b;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 44px 48px 56px;
      min-height: 700px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.07);
      transition: opacity 0.22s ease;
      overflow: hidden;
    }
    .paper-sheet.flipping { opacity: 0.4; }

    .paper-seal {
      position: absolute;
      right: 46px;
      bottom: 60px;
      padding: 6px 13px 5px;
      border: 1.6px solid var(--seal);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--seal);
      font-family: var(--font-heading);
      font-style: italic;
      font-weight: 500;
      font-size: 20px;
      line-height: 1;
      transform: rotate(-5deg);
      opacity: 0.85;
      pointer-events: none;
    }
    .paper-seal span {
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 7px;
      letter-spacing: 0.15em;
      margin-top: 3px;
    }

    .p-head {
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }
    .p-name { font-family: var(--font-heading); font-size: 32px; font-weight: 600; color: #09090b; line-height: 1.1; }
    .p-role { font-size: 13.5px; color: #52525b; margin-top: 4px; }
    .p-contact { font-family: var(--font-mono); font-size: 11.5px; color: #52525b; text-align: right; line-height: 1.68; }
    .p-sec { margin-bottom: 18px; }
    .p-sec-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    .p-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .p-row-t { font-weight: 600; font-size: 14px; color: #18181b; }
    .p-row-d { font-family: var(--font-mono); font-size: 11px; color: #71717a; white-space: nowrap; }
    .p-desc { font-size: 13.5px; line-height: 1.68; color: #3f3f46; margin-bottom: 12px; }
    .p-num { position: absolute; left: 48px; bottom: 20px; font-family: var(--font-mono); font-size: 11px; color: #a1a1aa; }
    .page-curl {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, transparent 48%, rgba(15, 23, 42, 0.08) 50%, #e5e7eb 53%, #ffffff 78%, #d1d5db 100%);
      border: none;
      cursor: pointer;
      transition: width 0.22s var(--ease), height 0.22s var(--ease);
    }
    .page-curl:hover { width: 66px; height: 66px; }

    .paper-ctrls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    .p-ctrl {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .p-ctrl:hover { border-color: var(--ink); }
    .p-ctrl.primary { background: var(--charcoal); color: #ffffff; border-color: var(--charcoal); }

    /* Footer */
    .site-footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12.5px;
      color: var(--mute);
    }
    .footer-motto {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: 14px;
      color: var(--ink2);
    }
    .seal-cta {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--mute);
      background: none;
      border: none;
      cursor: pointer;
    }
    .seal-cta:hover { color: var(--ink); }

    /* Bottom Floating Capsule Dock */
    .dock-wrap {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
    }

    .dock {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      background: var(--dock-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .dock-btn {
      padding: 7px 15px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--ink2);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.22s var(--ease);
    }
    .dock-btn:hover { color: var(--ink); }
    .dock-btn.active { background: var(--charcoal); color: #ffffff; }

    .sound-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      flex-shrink: 0;
      color: var(--ink2);
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .sound-btn:hover { border-color: var(--ink); color: var(--ink); }
    .sound-bars { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
    .s-bar { width: 2px; height: 6px; border-radius: 2px; background: #9ca3af; }
    .sound-btn.playing { border-color: var(--ink); color: var(--ink); }
    .sound-btn.playing .s-bar { background: var(--ink); animation: sWave 1.1s ease-in-out infinite; }
    .sound-btn.playing .s-bar:nth-child(2) { animation-delay: 0.2s; }
    .sound-btn.playing .s-bar:nth-child(3) { animation-delay: 0.4s; }
    .sound-btn.playing .s-bar:nth-child(4) { animation-delay: 0.15s; }
    @keyframes sWave { 0%, 100% { height: 4px; } 50% { height: 13px; } }

    /* Command Palette (⌘K) */
    .cmd-bg {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(17, 24, 39, 0.24);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 14vh 20px 20px;
    }
    .cmd-bg.open { display: flex; animation: viewIn 0.18s var(--ease); }
    .cmd-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 56px rgba(15, 23, 42, 0.16);
    }
    .cmd-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--mute);
    }
    .cmd-list { padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    .cmd-item {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
    }
    .cmd-item:hover { background: #f3f4f6; }
    .cmd-key { font-family: var(--font-mono); font-size: 11px; color: var(--mute); }

    /* Reader Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(17, 24, 39, 0.28);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 620px;
      max-height: 82vh;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      position: relative;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.16);
    }
    .modal-x {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--ink);
      font-size: 17px;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      z-index: 90;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--charcoal);
      color: #ffffff;
      font-size: 12.5px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s var(--ease);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 860px) {
      .split-layout { grid-template-columns: 1fr; gap: 32px; padding-top: 28px; }
      .split-left { position: static; min-height: auto; }
      .sticky-nav { display: none; }
      .dim-item { grid-template-columns: 1fr; gap: 6px; }
      .gb-layout { grid-template-columns: 1fr; }
      .paper-sheet { padding: 28px 20px 48px; min-height: 560px; }
      .paper-under { display: none; }
      .paper-seal { right: 20px; bottom: 48px; font-size: 17px; }
      .sound-label { display: none; }
    }

    @media print {
      #subtleRingCanvas, #stampOverlay, .masthead, .dock-wrap, .site-footer,
      .paper-ctrls, .paper-under, .page-curl, .modal-bg, .cmd-bg, .toast {
        display: none !important;
      }
      html, body { background: #ffffff !important; color: #111111 !important; }
      .shell { max-width: 100% !important; padding: 0 !important; }
      .view { display: none !important; }
      #view-resume { display: block !important; }
      .paper-stage { padding: 0 !important; }
      .paper-sheet { box-shadow: none !important; border: none !important; padding: 10px 14px !important; min-height: auto !important; }
    }
    /* Guestbook server state */
    .hp-field { position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden; }
    .gb-meta { display:flex; justify-content:space-between; gap:12px; margin-top:10px; font-family:var(--font-mono); font-size:11px; color:var(--mute); }
    .gb-more-wrap { margin-top:16px; text-align:center; }
    .gb-status { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; color:var(--mute); }
    .writing-index a.w-row { text-decoration:none; }

    .hp-field { position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden; }
    .gb-meta { display:flex; justify-content:space-between; gap:12px; margin-top:10px; font-family:var(--font-mono); font-size:11px; color:var(--mute); }
    .gb-more-wrap { margin-top:16px; text-align:center; }
    .gb-status { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; color:var(--mute); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand-group" href="首页.dc.html" style="text-decoration:none;">
        <svg class="xl-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="2.5" y="2.5" width="27" height="27" rx="7" stroke="#18181B" stroke-width="1.8" fill="#FFFFFF" />
          <path d="M10.5 9.5V22.5H19.5" stroke="#18181B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="21.5" cy="11" r="2.6" fill="#D9381A" />
        </svg>
        <span class="brand-text">xiaoliang</span>
      </a>
      <div class="masthead-right">
        <a class="chip-btn" href="首页.dc.html" style="text-decoration:none;">← 回首页</a>
        <a class="chip-btn" href="简历CV.dc.html" style="text-decoration:none;">简历 CV</a>
      </div>
    </header>

    <h1 class="editorial-h1" style="margin-top: 40px;">路过，<em>留个爪印</em>。</h1>
    <p class="body-p">匿名也行 · 会一直留着 · <span id="gbTotalLine">共 … 条</span></p>

    <div class="gb-layout">
      <form class="gb-form" id="gbForm">
        <div class="sec-label" style="margin-bottom: 8px;">GUESTBOOK · 留言墙</div>
        <p class="item-desc" style="margin-bottom: 16px;">
          欢迎交流技术问题、项目建议或工作机会，也可以随手留一枚脚印。
        </p>
        <label class="f-label" for="gbName">称呼 / NAME</label>
        <input class="f-input" id="gbName" type="text" placeholder="名字（可空）" maxlength="24" autocomplete="nickname" />
        <label class="f-label" for="gbMsg">内容 / MESSAGE</label>
        <textarea class="f-area" id="gbMsg" rows="3" placeholder="想说的话 …（回车发送，Shift+回车换行）" maxlength="300"></textarea>
        <button class="f-submit" type="submit" id="gbSubmitBtn">落印留言</button>
        <div class="hp-field" aria-hidden="true">
          <input name="website" tabindex="-1" autocomplete="off" id="gbHp" placeholder="website" />
        </div>
        <div class="gb-meta"><span id="gbFormMsg" role="status" aria-live="polite"></span><span id="gbCount">0 / 300</span></div>
      </form>
      <div>
        <div class="stamp-grid" id="stampGrid"></div>
        <div class="gb-more-wrap"><div class="gb-status" id="gbStatus">加载中 …</div>
        <button class="p-ctrl" id="gbMoreBtn" type="button" style="display:none; margin-top:10px;">更多留言 ↓</button></div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-motto">“带着离开的决心，只为更好的归来。” · © 2026 Liang</div>
      <a class="clean-link" href="首页.dc.html">回首页 ↗</a>
    </footer>
  </div>

  <script>
    (function () {
      const GB_API = '/api/guestbook';
      const GB_PAGE = 30;
      const GB_NAME_MAX = 24;
      const GB_TEXT_MAX = 300;
      const gbLen = (s) => Array.from(s).length;
      let gbList = [], gbTotal = null, gbHasMore = false, gbLoading = false, gbLoadingMore = false, gbPosting = false;

      function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function gbFetch(url, opts) {
        let res;
        try {
          res = await fetch(url, { cache: 'no-store', ...opts, headers: { Accept: 'application/json', ...(opts && opts.headers) } });
        } catch (_) {
          return { ok: false, status: 0, data: { message: '网络好像断了，稍后再试' } };
        }
        let data = null;
        try { data = await res.json(); } catch (_) {}
        return { ok: res.ok, status: res.status, data: data || {} };
      }

      function gbWhen(iso, now) {
        const d = new Date(iso);
        if (isNaN(d)) return { d: '', full: '' };
        const p = (n) => String(n).padStart(2, '0');
        const full = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        const sec = Math.max(0, (now - d.getTime()) / 1000);
        let rel;
        if (sec < 60) rel = '刚刚';
        else if (sec < 3600) rel = Math.floor(sec / 60) + ' 分钟前';
        else if (sec < 86400) rel = Math.floor(sec / 3600) + ' 小时前';
        else if (sec < 7 * 86400) rel = Math.floor(sec / 86400) + ' 天前';
        else if (d.getFullYear() === new Date(now).getFullYear()) rel = p(d.getMonth() + 1) + '-' + p(d.getDate());
        else rel = full.slice(0, 10);
        return { d: rel, full };
      }

      function gbStatusLine() {
        const el = document.getElementById('gbStatus');
        const total = document.getElementById('gbTotalLine');
        if (total) total.textContent = '共 ' + (gbTotal == null ? '…' : gbTotal) + ' 条';
        if (!el) return;
        el.style.cursor = '';
        el.onclick = null;
        if (gbLoading && !gbList.length) el.textContent = '加载中 …';
        else if (gbList.length === 0) el.textContent = '还没有人留言，第一条留给你';
        else el.textContent = '共 ' + (gbTotal == null ? gbList.length : gbTotal) + ' 条';
      }

      function renderStamps() {
        const now = Date.now();
        document.getElementById('stampGrid').innerHTML = gbList.map(m => {
          const w = gbWhen(m.created_at, now);
          return `
          <div class="stamp-card">
            <span class="stamp-tag">${esc(m.name || '匿名')}</span>
            <p style="font-size:13.5px; line-height:1.65; color:var(--ink2); margin-bottom:8px; white-space:pre-wrap; overflow-wrap:anywhere;">${esc(m.content)}</p>
            <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--mute);" title="${esc(w.full)}">${esc(w.d)}</div>
          </div>`;
        }).join('');
        const more = document.getElementById('gbMoreBtn');
        if (more) more.style.display = gbHasMore ? '' : 'none';
        gbStatusLine();
      }

      async function gbLoad(more) {
        if (more) { if (gbLoadingMore) return; gbLoadingMore = true; }
        else gbLoading = true;
        gbStatusLine();
        const before = more && gbList.length ? '&before=' + gbList[gbList.length - 1].id : '';
        const r = await gbFetch(GB_API + '?limit=' + GB_PAGE + before);
        if (!r.ok || !Array.isArray(r.data.items)) {
          gbLoading = false; gbLoadingMore = false;
          const el = document.getElementById('gbStatus');
          if (el) { el.textContent = '留言加载失败 · 点这里重试'; el.style.cursor = 'pointer'; el.onclick = () => gbLoad(false); }
          return;
        }
        const cur = more ? gbList : [];
        const seen = new Set(cur.map((m) => m.id));
        gbList = cur.concat(r.data.items.filter((m) => !seen.has(m.id)));
        gbHasMore = !!r.data.has_more;
        gbTotal = typeof r.data.total === 'number' ? r.data.total : gbTotal;
        gbLoading = false; gbLoadingMore = false;
        renderStamps();
      }

      function updateGbCount() {
        const el = document.getElementById('gbCount');
        if (!el) return;
        const len = gbLen(document.getElementById('gbMsg').value);
        el.textContent = len + ' / ' + GB_TEXT_MAX;
        el.style.color = len > GB_TEXT_MAX - 20 ? '#d9381a' : '';
      }

      document.getElementById('gbForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (gbPosting) return;
        const n = document.getElementById('gbName');
        const m = document.getElementById('gbMsg');
        const hp = document.getElementById('gbHp');
        const name = n.value.trim();
        const text = m.value.trim();
        const msgEl = document.getElementById('gbFormMsg');
        const setMsg = (t, err) => { if (msgEl) { msgEl.textContent = t; msgEl.style.color = err ? '#d9381a' : '#059669'; } };
        if (!text) return setMsg('留言内容不能为空', true);
        if (gbLen(name) > GB_NAME_MAX) return setMsg('名字最多 ' + GB_NAME_MAX + ' 个字', true);
        if (gbLen(text) > GB_TEXT_MAX) return setMsg('留言最多 ' + GB_TEXT_MAX + ' 个字', true);
        gbPosting = true;
        setMsg('', false);
        const r = await gbFetch(GB_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, content: text, website: hp ? hp.value : '' })
        });
        gbPosting = false;
        if (!r.ok || !r.data.item) {
          setMsg(r.data.message || (r.status === 429 ? '发得太快了，稍后再试' : '没贴上去，稍后再试'), true);
          return;
        }
        try { localStorage.setItem('xl-gb-name', name); } catch (err) {}
        const item = { ...r.data.item };
        gbList = [item, ...gbList.filter((x) => x.id !== item.id)];
        gbTotal = (gbTotal || 0) + 1;
        m.value = '';
        updateGbCount();
        renderStamps();
        setMsg('贴好了', false);
      });

      try { const saved = localStorage.getItem('xl-gb-name'); if (saved) document.getElementById('gbName').value = saved.slice(0, GB_NAME_MAX); } catch (err) {}
      document.getElementById('gbMsg').addEventListener('input', updateGbCount);
      document.getElementById('gbMsg').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.nativeEvent.isComposing || e.keyCode === 229) return;
        if (e.shiftKey) return;
        e.preventDefault();
        document.getElementById('gbForm').requestSubmit();
      });
      document.getElementById('gbName').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.nativeEvent.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        document.getElementById('gbForm').requestSubmit();
      });
      document.getElementById('gbMoreBtn').addEventListener('click', () => gbLoad(true));
      setInterval(renderStamps, 60000);
      gbLoad();
      updateGbCount();
    })();
  </script>
</body>
</html>
